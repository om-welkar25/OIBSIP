<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter">

        <h1>Temperature Converter</h1>

        <p class="subtitle">
            Convert temperature quickly and accurately
        </p>

        <div class="converter-box">

            <!-- Temperature Input -->

            <div class="input-group">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter value"
                >

            </div>


            <!-- Unit Selection -->

            <div class="input-group">

                <label for="unit">
                    Select Unit
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Convert Button -->

            <button id="convertBtn">
                Convert Temperature
            </button>


            <!-- Error Message -->

            <p id="errorMessage"></p>


            <!-- Results -->

            <div class="results">

                <div class="result-card">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-card">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-card">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
